# Tag v1.2.3 → ttm-sync_1.2.3_{amd64,arm64}.deb → GitHub Release.
# The apt repository tihonove/apt picks the packages up from there; scripts/release triggers it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/sync/go.mod
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Plain X.Y.Z only: a Debian "1.2.3-rc1" would sort above 1.2.3, and git tags cannot hold "~".
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:go
      # The binary is static, so one package serves every Ubuntu release.
      - run: npm run build:bin -- --version ${{ steps.version.outputs.version }}
      - run: npm run build:deb -- --version ${{ steps.version.outputs.version }}
      - run: gh release create "$GITHUB_REF_NAME" dist/*.deb --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
