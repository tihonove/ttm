name: mobile

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/parser/**", ".github/workflows/mobile.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Every build gets a higher versionCode so Android installs it over the previous one.
      - working-directory: apps/mobile
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '
          npx expo prebuild --platform android --no-install
      - working-directory: apps/mobile/android
        # arm64 only: every phone in use is arm64, and the APK is a third of the universal size.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      # Re-signed with the app's own key: the template signs release builds with a throwaway
      # debug key, which would differ every run and block updates.
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ttm.jks"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/ttm.jks" --ks-key-alias ttm \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out ttm.apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --print-certs ttm.apk | head -3
      # An artifact, not a release: GITHUB_TOKEN may not tag a commit that changes workflows,
      # and a release would also compete with the ttm-sync debs that tihonove/apt picks up.
      - uses: actions/upload-artifact@v4
        with:
          name: ttm-apk-${{ github.run_number }}
          path: ttm.apk
          retention-days: 30
      # The server image carries the APK for download; rebuild it with this one.
      - name: Ship the APK with the server
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yaml --ref main
