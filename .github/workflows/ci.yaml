name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["deploy/kustomization.yaml"]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      # Ratchet: fails if coverage drops below the thresholds in vitest.config.ts.
      - run: npm run test:coverage -- --coverage.thresholds.autoUpdate=false

  # Mutation gate on the PR diff only; the nightly workflow covers everything.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.head_ref }}-
            stryker-main-
      - run: npm run test:mutation -- --base origin/${{ github.base_ref }}
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.number }} --body-file reports/mutation/gate.md --edit-last --create-if-none
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
      # Committing the new tag is the deploy: Flux picks it up within a minute.
      - name: Deploy
        run: |
          sed -i "s/newTag: .*/newTag: ${{ steps.tag.outputs.tag }}/" deploy/kustomization.yaml
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "deploy: ${{ steps.tag.outputs.tag }}"
          git push
